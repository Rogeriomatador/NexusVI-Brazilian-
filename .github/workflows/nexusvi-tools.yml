name: NexusVI independent tools

on:
  push:
    branches: ['nexusvi/**']
    paths:
      - 'scripts/nexusvi_sample_stats.rs'
      - '.github/workflows/nexusvi-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Compile and execute standalone tests
        run: |
          rustc +stable --edition=2024 --test scripts/nexusvi_sample_stats.rs -o nexusvi_sample_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_sample_tests.exe
          exit $LASTEXITCODE
