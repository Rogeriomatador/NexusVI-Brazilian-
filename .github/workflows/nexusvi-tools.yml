name: NexusVI independent tools

on:
  push:
    branches: ['nexusvi/**']
    paths:
      - 'scripts/nexusvi_sample_stats.rs'
      - 'scripts/nexusvi_compare.rs'
      - 'scripts/nexusvi_synthetic.rs'
      - 'scripts/nexusvi_synthetic_report.rs'
      - 'scripts/nexusvi_range_arena.rs'
      - 'scripts/nexusvi_graphics_verify.js'
      - 'scripts/nexusvi_strict_json.js'
      - 'scripts/nexusvi_evidence_manifest.js'
      - 'scripts/nexusvi_revision_compare.js'
      - 'scripts/nexusvi_fragmentation.js'
      - 'scripts/nexusvi_indexed_arena.js'
      - 'scripts/nexusvi_sparse_arena.js'
      - 'scripts/nexusvi_sparse_arena_v2.js'
      - 'scripts/nexusvi_sparse_arena_v3.js'
      - 'scripts/nexusvi_sparse_arena_v4.js'
      - 'scripts/nexusvi_sparse_scaling.js'
      - 'scripts/nexusvi_arena_timing.js'
      - 'scripts/nexusvi_timing_context.js'
      - 'scripts/nexusvi_repeatability.js'
      - 'scripts/nexusvi_interleaved_control.js'
      - 'scripts/nexusvi_cache_policies.js'
      - 'scripts/nexusvi_cache_adaptive.js'
      - 'scripts/nexusvi_cache_weighted.js'
      - 'scripts/nexusvi_cache_admission.js'
      - 'scripts/nexusvi_cache_timing.js'
      - 'scripts/nexusvi_cache_size_admission.js'
      - 'scripts/nexusvi_cache_cost.js'
      - 'scripts/nexusvi_batch_coalesce.js'
      - 'scripts/nexusvi_batch_adaptive.js'
      - 'scripts/nexusvi_batch_cost.js'
      - 'scripts/nexusvi_dirty_tiles.js'
      - 'scripts/nexusvi_tile_binning.js'
      - 'scripts/nexusvi_core_compositor.js'
      - 'scripts/nexusvi_core_v2.js'
      - 'scripts/nexusvi_egl_control.py'
      - 'scripts/nexusvi_gl_pipeline.py'
      - 'scripts/nexusvi_gl_transfers.py'
      - 'scripts/nexusvi_gl_framebuffer.py'
      - 'scripts/nexusvi_gl_cache.py'
      - 'scripts/nexusvi_native_evidence.py'
      - 'scripts/nexusvi_vulkan_probe.py'
      - 'scripts/nexusvi_vk_fixture.hpp'
      - 'scripts/nexusvi_vk_fixture_test.cpp'
      - 'scripts/nexusvi_vk_compute.cpp'
      - 'scripts/nexusvi_vk_compute.comp'
      - 'scripts/nexusvi_vk_runner.py'
      - 'scripts/nexusvi_arena_timing_report.js'
      - 'scripts/NexusVI-Graphics-Control-V2.html'
      - 'scripts/nexusvi_hardware_control.ps1'
      - '.github/workflows/nexusvi-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Compile and execute standalone tests
        run: |
          rustc +stable --edition=2024 --test scripts/nexusvi_sample_stats.rs -o nexusvi_sample_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_sample_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --edition=2024 --test scripts/nexusvi_compare.rs -o nexusvi_compare_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_compare_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --edition=2024 --test scripts/nexusvi_synthetic.rs -o nexusvi_synthetic_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_synthetic_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --edition=2024 --test scripts/nexusvi_synthetic_report.rs -o nexusvi_report_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_report_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --edition=2024 --test scripts/nexusvi_range_arena.rs -o nexusvi_arena_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_arena_tests.exe --nocapture
          exit $LASTEXITCODE
      - name: Run synthetic control (not a performance gate)
        run: |
          rustc +stable --edition=2024 -O scripts/nexusvi_synthetic.rs -o nexusvi_synthetic.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = @(./nexusvi_synthetic.exe 65536 20 42)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($rows.Count -ne 22 -or $rows[1] -ne 'pair_id,reference_ns,single_pass_ns') {
            throw 'Unexpected synthetic report'
          }
          $rows | Write-Output
          rustc +stable --edition=2024 -O scripts/nexusvi_synthetic_report.rs -o nexusvi_report.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows | ./nexusvi_report.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows | Select-Object -SkipLast 1 | ./nexusvi_report.exe
          if ($LASTEXITCODE -ne 1) { throw 'Truncated report was not rejected' }
          exit 0
      - name: Run independent range model
        run: |
          rustc +stable --edition=2024 -O scripts/nexusvi_range_arena.rs -o nexusvi_arena.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_arena.exe
          exit $LASTEXITCODE
      - name: Validate Windows in-process hardware report
        if: runner.os == 'Windows'
        run: |
          $report = (& ./scripts/nexusvi_hardware_control.ps1 -Seconds 5 -SampleMs 250 | Out-String | ConvertFrom-Json)
          if ($report.scope -ne 'independent_synthetic_cpu_only' -or $report.schema_version -ne 2) {
            throw 'Unexpected report identity'
          }
          if ($report.metrics.sample_count -lt 2 -or $report.metrics.sample_count -ne $report.samples.Count) {
            throw 'Invalid sample count'
          }
          if (-not $report.workload.completed -or $report.workload.completed_hashes -le 0 -or $report.metrics.observed_cpu_total_ms -le 0) {
            throw 'Invalid CPU observation'
          }
          if ($null -ne $report.metrics.fps -or $null -ne $report.metrics.vram_bytes) {
            throw 'CPU control must not claim GPU measurements'
          }
          $actualHash = (Get-FileHash -LiteralPath ./scripts/nexusvi_hardware_control.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($report.source.collector_sha256 -ne $actualHash) {
            throw 'Collector hash mismatch'
          }
          if ($report.source.git_revision -ne $env:GITHUB_SHA -or $report.source.git_status -ne 'revision_observed') {
            throw "Source revision mismatch; status=$($report.source.git_status); observed=$($report.source.git_revision); expected=$env:GITHUB_SHA"
          }
          if ($report.workload.measurement_mode -ne 'current_powershell_process_including_host_overhead' -or $report.workload.measured_elapsed_ms -lt 5000) {
            throw 'Invalid measurement scope or duration'
          }
          if ($report.samples[0].completed_hashes -ne 0 -or $report.samples[-1].completed_hashes -ne $report.workload.completed_hashes) {
            throw 'Invalid operation counters'
          }
          $report | ConvertTo-Json -Depth 8 | Write-Output
      - name: Validate standalone collector in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP ('nexusvi-control-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dir | Out-Null
          try {
            $file = Join-Path $dir 'nexusvi_hardware_control.ps1'
            Copy-Item -LiteralPath ./scripts/nexusvi_hardware_control.ps1 -Destination $file
            $report = (& $file -Seconds 5 -SampleMs 250 | Out-String | ConvertFrom-Json)
            if ($report.schema_version -ne 2 -or -not $report.workload.completed -or $report.workload.completed_hashes -le 0 -or $report.workload.measured_elapsed_ms -lt 5000) {
              throw 'Standalone workload did not complete'
            }
            if ($report.source.git_revision -ne $null -or $report.source.git_status -ne 'standalone_or_unavailable') {
              throw 'Standalone file must not claim a Git revision'
            }
            if ($report.source.collector_sha256 -ne (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -or $report.metrics.sample_count -lt 2) {
              throw 'Standalone report validation failed'
            }
          } finally {
            Remove-Item -LiteralPath $dir -Recurse -Force
          }
      - name: Verify independent graphics report fixtures
        run: |
          node --version
          node scripts/nexusvi_strict_json.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_graphics_verify.js --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_graphics_verify.js --fixture | Set-Content -Encoding utf8 synthetic-graphics.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_graphics_verify.js synthetic-graphics.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -Encoding utf8 synthetic-graphics-invalid.json '{}'
          node scripts/nexusvi_graphics_verify.js synthetic-graphics-invalid.json
          if ($LASTEXITCODE -ne 1) { throw 'Invalid report not rejected' }
          exit 0
      - name: Compare logical allocation policies
        run: |
          node scripts/nexusvi_fragmentation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_fragmentation.js --holdout
          exit $LASTEXITCODE
      - name: Verify indexed logical first-fit arena
        run: |
          node scripts/nexusvi_indexed_arena.js
          exit $LASTEXITCODE
      - name: Verify sparse logical AVL first-fit arena
        run: |
          node scripts/nexusvi_sparse_arena.js
          exit $LASTEXITCODE
      - name: Measure instrumented logical arena replay timing
        run: |
          node scripts/nexusvi_timing_context.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_arena_timing_report.js --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_arena_timing.js | Set-Content -Encoding utf8 arena-timing.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_arena_timing_report.js arena-timing.json
          exit $LASTEXITCODE
      - name: Compare AVL lookup elimination and paired timing
        run: |
          node scripts/nexusvi_sparse_arena_v2.js
          exit $LASTEXITCODE
      - name: Compare AVL refresh elimination and paired timing
        run: |
          node scripts/nexusvi_sparse_arena_v3.js
          exit $LASTEXITCODE
      - name: Compare AVL successor extraction and paired timing
        run: |
          node scripts/nexusvi_sparse_arena_v4.js
          exit $LASTEXITCODE
      - name: Verify and measure larger fragmented AVL arenas
        run: |
          node scripts/nexusvi_sparse_scaling.js
          exit $LASTEXITCODE
      - name: Measure same-process logical repeatability
        run: |
          node scripts/nexusvi_repeatability.js
          exit $LASTEXITCODE
      - name: Measure interleaved identical and alternative logical allocators
        run: |
          node scripts/nexusvi_interleaved_control.js
          exit $LASTEXITCODE
      - name: Verify independent logical cache policies
        run: |
          node scripts/nexusvi_cache_policies.js
          exit $LASTEXITCODE
      - name: Verify adaptive logical cache and bounded ghost history
        run: |
          node scripts/nexusvi_cache_adaptive.js
          exit $LASTEXITCODE
      - name: Verify byte-budget logical cache policies
        run: |
          node scripts/nexusvi_cache_weighted.js
          exit $LASTEXITCODE
      - name: Verify bounded second-touch byte-cache admission
        run: |
          node scripts/nexusvi_cache_admission.js
          exit $LASTEXITCODE
      - name: Measure independent byte-cache admission overhead
        run: |
          node scripts/nexusvi_cache_timing.js
          exit $LASTEXITCODE
      - name: Verify independent size-sensitive cache admission
        run: |
          node scripts/nexusvi_cache_size_admission.js
          exit $LASTEXITCODE
      - name: Evaluate independent cache cost sensitivity
        run: |
          node scripts/nexusvi_cache_cost.js
          exit $LASTEXITCODE
      - name: Verify independent snapshot batch coalescing
        run: |
          node scripts/nexusvi_batch_coalesce.js
          exit $LASTEXITCODE
      - name: Verify independent adaptive snapshot batching
        run: |
          node scripts/nexusvi_batch_adaptive.js
          exit $LASTEXITCODE
      - name: Evaluate independent batch cost sensitivity
        run: |
          node scripts/nexusvi_batch_cost.js
          exit $LASTEXITCODE
      - name: Verify independent CPU dirty-tile framebuffer
        run: |
          node scripts/nexusvi_dirty_tiles.js
          exit $LASTEXITCODE
      - name: Verify independent CPU spatial tile binning
        run: |
          node scripts/nexusvi_tile_binning.js
          exit $LASTEXITCODE
      - name: Verify and measure independent integrated CPU compositor
        run: |
          node scripts/nexusvi_core_compositor.js
          exit $LASTEXITCODE
      - name: Verify and measure independent CPU compositor V2
        run: |
          node scripts/nexusvi_core_v2.js
          exit $LASTEXITCODE
      - name: Create and verify independent evidence manifest
        run: |
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw 'Unexpected checkout revision' }
          node scripts/nexusvi_evidence_manifest.js --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_evidence_manifest.js create . $revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_evidence_manifest.js verify . $revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_revision_compare.js --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/nexusvi_revision_compare.js --check-bundle . $revision
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: nexusvi-independent-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            arena-timing.json
            synthetic-graphics.json
            evidence-manifest.json
          if-no-files-found: error
          retention-days: 30

  native-egl-software:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa software graphics
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
      - name: Verify native API pixel readback (software only)
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 scripts/nexusvi_native_evidence.py --self-test
          python3 scripts/nexusvi_native_evidence.py > native-gl-evidence.json
          cat native-gl-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: nexusvi-native-gl-${{ github.run_attempt }}
          path: native-gl-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Discover Vulkan software device (no workload)
        run: python3 scripts/nexusvi_vulkan_probe.py


  native-vulkan-software:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software driver and shader tools
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools
      - name: Verify Vulkan runner evidence schema
        run: python3 scripts/nexusvi_vk_runner.py --self-test
      - name: Verify independent host fixture
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined -O2 scripts/nexusvi_vk_fixture_test.cpp -o nexusvi-vk-fixture
          ./nexusvi-vk-fixture
      - name: Compile and validate original SPIR-V
        run: |
          glslangValidator -V --target-env vulkan1.0 -S comp scripts/nexusvi_vk_compute.comp -o control.spv
          spirv-val --target-env vulkan1.0 control.spv
          spirv-opt --target-env=vulkan1.0 -O control.spv -o control-opt.spv
          spirv-val --target-env vulkan1.0 control-opt.spv
          python3 -c "from pathlib import Path; b=Path('control.spv').read_bytes(); Path('invalid.spv').write_bytes(bytes(4)+b[4:])"
          if spirv-val --target-env vulkan1.0 invalid.spv; then echo 'Invalid SPIR-V accepted'; exit 1; fi
      - name: Build native Vulkan compute control
        run: c++ -std=c++17 -Wall -Wextra -Werror -O2 scripts/nexusvi_vk_compute.cpp -lvulkan -o nexusvi-vk-compute
      - name: Execute original and optimized modules with validation
        shell: bash
        run: |
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#icds[@]}" -eq 1
          export VK_DRIVER_FILES="${icds[0]}"
          timeout 60s ./nexusvi-vk-compute control.spv | tee vulkan-original.json
          timeout 60s ./nexusvi-vk-compute control-opt.spv | tee vulkan-optimized.json
          python3 -c "import json; from pathlib import Path; a,b=[json.loads(Path(p).read_text()) for p in ('vulkan-original.json','vulkan-optimized.json')]; assert all(x['dispatches']==120 and x['values_checked']==493560 and x['validation_errors']==0 and x['device_type']==4 and x['physical_gpu_verified'] is False for x in (a,b)); assert (a['vendor_id'],a['device_id'],a['driver_version'])==(b['vendor_id'],b['device_id'],b['driver_version'])"
          python3 scripts/nexusvi_vk_runner.py --mode software > vulkan-runner.json
          sha256sum control.spv control-opt.spv scripts/nexusvi_vk_compute.cpp scripts/nexusvi_vk_compute.comp scripts/nexusvi_vk_fixture.hpp > vulkan-sources.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nexusvi-vulkan-software-${{ github.run_attempt }}
          path: |
            vulkan-original.json
            vulkan-optimized.json
            vulkan-sources.sha256
            vulkan-runner.json
          if-no-files-found: error
          retention-days: 30
