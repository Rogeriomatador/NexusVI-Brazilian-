name: NexusVI independent tools

on:
  push:
    branches: ['nexusvi/**']
    paths:
      - 'scripts/nexusvi_sample_stats.rs'
      - 'scripts/nexusvi_compare.rs'
      - 'scripts/nexusvi_synthetic.rs'
      - 'scripts/nexusvi_synthetic_report.rs'
      - 'scripts/nexusvi_range_arena.rs'
      - 'scripts/nexusvi_hardware_control.ps1'
      - '.github/workflows/nexusvi-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Compile and execute standalone tests
        run: |
          rustc +stable --edition=2024 --test scripts/nexusvi_sample_stats.rs -o nexusvi_sample_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_sample_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --edition=2024 --test scripts/nexusvi_compare.rs -o nexusvi_compare_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_compare_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --edition=2024 --test scripts/nexusvi_synthetic.rs -o nexusvi_synthetic_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_synthetic_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --edition=2024 --test scripts/nexusvi_synthetic_report.rs -o nexusvi_report_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_report_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --edition=2024 --test scripts/nexusvi_range_arena.rs -o nexusvi_arena_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_arena_tests.exe --nocapture
          exit $LASTEXITCODE
      - name: Run synthetic control (not a performance gate)
        run: |
          rustc +stable --edition=2024 -O scripts/nexusvi_synthetic.rs -o nexusvi_synthetic.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = @(./nexusvi_synthetic.exe 65536 20 42)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($rows.Count -ne 22 -or $rows[1] -ne 'pair_id,reference_ns,single_pass_ns') {
            throw 'Unexpected synthetic report'
          }
          $rows | Write-Output
          rustc +stable --edition=2024 -O scripts/nexusvi_synthetic_report.rs -o nexusvi_report.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows | ./nexusvi_report.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows | Select-Object -SkipLast 1 | ./nexusvi_report.exe
          if ($LASTEXITCODE -ne 1) { throw 'Truncated report was not rejected' }
          exit 0
      - name: Run independent range model
        run: |
          rustc +stable --edition=2024 -O scripts/nexusvi_range_arena.rs -o nexusvi_arena.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./nexusvi_arena.exe
          exit $LASTEXITCODE
      - name: Validate Windows hardware report on synthetic child
        if: runner.os == 'Windows'
        run: |
          $report = (& ./scripts/nexusvi_hardware_control.ps1 -Seconds 5 -SampleMs 250 | Out-String | ConvertFrom-Json)
          if ($report.scope -ne 'independent_synthetic_cpu_only' -or $report.schema_version -ne 1) {
            throw 'Unexpected report identity'
          }
          if ($report.metrics.sample_count -lt 2 -or $report.metrics.sample_count -ne $report.samples.Count) {
            throw 'Invalid sample count'
          }
          if ($report.workload.exit_code -ne 0 -or $report.metrics.observed_cpu_total_ms -le 0) {
            throw 'Invalid CPU observation'
          }
          if ($null -ne $report.metrics.fps -or $null -ne $report.metrics.vram_bytes) {
            throw 'CPU control must not claim GPU measurements'
          }
          if ($report.source.collector_sha256 -notmatch '^[0-9a-f]{64}$' -or $report.source.git_revision -ne $env:GITHUB_SHA) {
            throw 'Source identity mismatch'
          }
          $report | ConvertTo-Json -Depth 8 | Write-Output
